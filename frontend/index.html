<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/crtlogo.png">
    <title>Login Form</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="js-body" style="background: linear-gradient(135deg, #0a1628 0%, #1a365d 50%, #0d2137 100%) !important;">
    <div class="js-bg-image-layer" style="background-image: url('assets/Overview1.jpg');"></div>
    <main class="js-card">
        <aside class="js-left-panel" style="background-image: url('assets/Overview3.jpg'); position: relative;">
            <div id="blurOverlay" class="hidden absolute inset-0 bg-black bg-opacity-30 backdrop-blur-sm transition-all duration-500"></div>
            <div id="userProfile" class="hidden flex flex-col items-center justify-center h-full relative z-10">
                <div class="w-24 h-24 rounded-full bg-white bg-opacity-20 backdrop-blur-sm flex items-center justify-center overflow-hidden border-2 border-white border-opacity-30 mb-4">
                    <img id="profileImage" src="" alt="Profile" class="w-full h-full object-cover hidden">
                    <i data-lucide="user" id="defaultAvatar" class="w-12 h-12 text-white"></i>
                </div>
                <h2 id="welcomeMessage" class="text-white text-2xl font-bold mb-2 text-center"></h2>
                <p id="userEmail" class="text-white text-opacity-80 text-sm text-center"></p>
            </div>
        </aside>
        
        <section class="js-right-panel">
            <h1 class="js-heading">LOGIN FORM</h1>
            <p class="js-subheading">Enter your credentials to access your account</p>
            
            <form id="loginForm" class="js-form">
                <div class="js-form-group">
                    <label for="username" class="js-label">Username</label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        required
                        class="js-input"
                        placeholder="Enter your username"
                    >
                </div>
                
                <div class="js-form-group">
                    <label for="password" class="js-label">Password</label>
                    <div class="js-relative">
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            required
                            class="js-input-toggle"
                            placeholder="Enter your password"
                        >
                        <button type="button" id="togglePasswordBtn" class="js-btn-toggle">
                            <i data-lucide="eye-off" id="password-eye" class="js-icon"></i>
                        </button>
                    </div>
                </div>
                
                <button 
                    type="submit"
                    id="loginBtn"
                    class="js-btn-primary"
                >
                    Login
                </button>
            </form>
            
            <footer class="mt-6 text-center">
                <p class="text-gray-600 text-sm">
                    Don't have an Account? 
                    <a href="signup.html" class="js-link">
                        Register Here!
                    </a>
                </p>
            </footer>
        </section>
    </main>

    <script type="module" src="script.js"></script>
    <script type="module" src="tailwind-login.js"></script>

</body>
</html>
