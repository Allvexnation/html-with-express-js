<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="js-body">
    <main class="js-card">
        <aside class="js-left-panel" style="background-image: url('https://res.cloudinary.com/dbob1wota/image/upload/images_3_yg87hg.jpg');">
        </aside>
        
        <section class="js-right-panel">
            <h1 class="js-heading">LOGIN FORM</h1>
            <p class="js-subheading">Enter your credentials to access your account</p>
            
            <form id="loginForm" class="js-form">
                <div class="js-form-group">
                    <label for="username" class="js-label">Username</label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        required
                        class="js-input"
                        placeholder="Enter your username"
                    >
                </div>
                
                <div class="js-form-group">
                    <label for="password" class="js-label">Password</label>
                    <div class="js-relative">
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            required
                            class="js-input-toggle"
                            placeholder="Enter your password"
                        >
                        <button type="button" id="togglePasswordBtn" class="js-btn-toggle">
                            <i data-lucide="eye-off" id="password-eye" class="js-icon"></i>
                        </button>
                    </div>
                </div>
                
                <button 
                    type="submit"
                    id="loginBtn"
                    class="js-btn-primary"
                >
                    Login
                </button>
            </form>
            
            <footer class="mt-6 text-center">
                <p class="text-gray-600 text-sm">
                    Don't have an Account? 
                    <a href="signup.html" class="js-link">
                        Register Here!
                    </a>
                </p>
            </footer>
        </section>
    </main>

    <script type="module" src="tailwind-login.js"></script>
    <script type="module" src="script.js"></script>
</body>
</html>
