<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="animation.css">
</head>
<body class="bg-black text-white min-h-screen flex items-center justify-center">

<div class="grid-bg">
    <div class="grid-container"></div>
    <div class="grid-glow" id="gridGlow"></div>
</div>

<div class="w-full max-w-md p-8 bg-black/80 border border-white/20 rounded-2xl shadow-2xl backdrop-blur-sm">
    <h1 class="text-3xl font-bold mb-8 text-center">Login</h1>

    <form id="loginForm" class="space-y-6">

        <div>
            <input
                type="email"
                name="email"
                placeholder="Email"
                required
                class="w-full px-4 py-3 bg-white/10 border border-white/20 rounded-lg focus:outline-none focus:border-white/40 text-white placeholder-white/50 transition-colors">
        </div>

        <div>
            <input
                type="password"
                name="password"
                placeholder="Password"
                required
                class="w-full px-4 py-3 bg-white/10 border border-white/20 rounded-lg focus:outline-none focus:border-white/40 text-white placeholder-white/50 transition-colors">
        </div>

        <button
            type="submit"
            class="w-full px-4 py-3 bg-white text-black font-semibold rounded-lg hover:bg-white/90 transition-colors">
            Login
        </button>

    </form>

    <p class="mt-6 text-center text-white/60">
        <a href="signup.html" class="hover:text-white transition-colors">Create Account</a>
    </p>

    <div id="message" class="mt-4 text-center"></div>
</div>

<script src="animation.js"></script>
<script src="steps.js"></script>
<script src="auth.js"></script>
<script>
    initSteps('loginForm');
    document.getElementById('loginForm').addEventListener('submit', login);
</script>

</body>
</html>
