<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/crtlogo.png">
    <title>Registration Form</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="js-body" style="background: linear-gradient(135deg, #0a1628 0%, #1a365d 50%, #0d2137 100%) !important;">
    <div class="js-bg-image-layer" style="background-image: url('assets/Overview1.jpg');"></div>
    <main class="js-card">
        <aside class="js-left-panel"
            style="background-image: url('assets/Overview3.jpg');">
        </aside>
        <section class="js-right-panel">
            <h1 class="js-heading">REGISTRATION FORM</h1>
            <p class="js-subheading">Fill in your information to create an account</p>
            
            <form id="registrationForm" class="js-form" style="min-height: 350px;">
                <div class="form-group">
                    <label for="fullName" class="js-label">Full Name</label>
                    <input 
                        type="text" 
                        id="fullName" 
                        name="fullName" 
                        required
                        class="js-input"
                        placeholder="Enter your full name"
                    >
                </div>
                
                <div class="form-group">
                    <label for="address" class="js-label">Address</label>
                    <input 
                        type="text" 
                        id="address" 
                        name="address" 
                        required
                        class="js-input"
                        placeholder="Enter your address"
                    >
                </div>
                
                <div class="form-group">
                    <label for="cellNumber" class="js-label">Cell Number</label>
                    <input 
                        type="tel" 
                        id="cellNumber" 
                        name="cellNumber" 
                        required
                        inputmode="numeric"
                        pattern="[0-9]*"
                        class="js-input"
                        placeholder="Enter your cell number"
                    >
                </div>
                
                <div class="form-group">
                    <label for="dateOfBirth" class="js-label">Date of Birth</label>
                    <input 
                        type="date" 
                        id="dateOfBirth" 
                        name="dateOfBirth" 
                        required
                        class="js-input"
                    >
                </div>
                
                <div class="form-group">
                    <label for="age" class="js-label">Age</label>
                    <input 
                        type="number" 
                        id="age" 
                        name="age" 
                        required
                        min="1"
                        class="js-input"
                        placeholder="Enter your age"
                    >
                </div>
                
                <div class="form-group">
                    <label for="email" class="js-label">Email Address</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        required
                        class="js-input"
                        placeholder="Enter your email"
                    >
                </div>
                
                <div class="form-group">
                    <label for="regUsername" class="js-label">Username</label>
                    <input 
                        type="text" 
                        id="regUsername" 
                        name="regUsername" 
                        required
                        class="js-input"
                        placeholder="Choose a username"
                    >
                </div>
                
                <div class="form-group">
                    <label for="regPassword" class="js-label">Password</label>
                    <div class="relative">
                        <input 
                            type="password" 
                            id="regPassword" 
                            name="regPassword" 
                            required
                            class="js-input-toggle"
                            placeholder="Create a password"
                        >
                        <button type="button" id="regPasswordBtn" class="js-btn-toggle">
                            <i data-lucide="eye-off" id="regPassword-eye" class="w-5 h-5"></i>
                        </button>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="confirmPassword" class="js-label">Confirm Password</label>
                    <div class="relative">
                        <input 
                            type="password" 
                            id="confirmPassword" 
                            name="confirmPassword" 
                            required
                            class="js-input-toggle"
                            placeholder="Confirm your password"
                        >
                        <button type="button" id="confirmPasswordBtn" class="js-btn-toggle">
                            <i data-lucide="eye-off" id="confirmPassword-eye" class="w-5 h-5"></i>
                        </button>
                    </div>
                </div>
                
                <fieldset class="form-group">
                    <legend class="js-label-mb3">Gender Selection</legend>
                    <div class="js-radio-group">
                        <label class="js-radio-label">
                            <input type="radio" name="gender" value="male" required class="js-radio">
                            <span class="js-span">Male</span>
                        </label>
                        <label class="js-radio-label">
                            <input type="radio" name="gender" value="female" required class="js-radio">
                            <span class="js-span">Female</span>
                        </label>
                        <label class="js-radio-label">
                            <input type="radio" name="gender" value="other" required class="js-radio">
                            <span class="js-span">Other</span>
                        </label>
                    </div>
                </fieldset>
                
                <fieldset class="form-group">
                    <legend class="js-label-mb3">Hobbies</legend>
                    <div class="js-hobbies-grid">
                        <label class="js-radio-label">
                            <input type="radio" name="hobbies" value="coding" required class="js-radio">
                            <span class="js-span">Coding</span>
                        </label>
                        <label class="js-radio-label">
                            <input type="radio" name="hobbies" value="reading" required class="js-radio">
                            <span class="js-span">Reading</span>
                        </label>
                        <label class="js-radio-label">
                            <input type="radio" name="hobbies" value="music" required class="js-radio">
                            <span class="js-span">Music</span>
                        </label>
                        <label class="js-radio-label">
                            <input type="radio" name="hobbies" value="art" required class="js-radio">
                            <span class="js-span">Art</span>
                        </label>
                        <label class="js-radio-label">
                            <input type="radio" name="hobbies" value="gaming" required class="js-radio">
                            <span class="js-span">Gaming</span>
                        </label>
                    </div>
                </fieldset>
                
                <div class="form-group">
                    <label class="js-checkbox-label">
                        <input type="checkbox" id="agreement" name="agreement" required class="js-checkbox">
                        <span class="js-span-sm">I certify that the information provided is true and correct.</span>
                    </label>
                </div>
                
                <button 
                    type="submit"
                    class="js-btn-primary"
                >
                    Register
                </button>
            </form>
            
            <footer class="mt-6 text-center">
                <p class="text-gray-600 text-sm">
                    Already have an account? 
                    <a href="index.html" class="js-link">
                        Login Here!
                    </a>
                </p>
            </footer>
        </section>
    </main>

    <script type="module" src="bundle.js"></script>
    <script type="module" src="tailwind-signup.js"></script>
    <script type="module" src="script.js"></script>
</body>
</html>
